name: MediaGrid
options:
  bundleIdPrefix: com.jeyaprakash
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  MediaGrid:
    type: application
    platform: iOS
    sources:
      - path: MediaGrid
      - path: Shared
    dependencies:
      - target: MediaGridWidgets
        embed: true
      - target: MediaGridShare
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jeyaprakash.mediagrid
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: MediaGrid/Info.plist
      properties:
        CFBundleDisplayName: MediaGrid
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: AccentColor
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIStatusBarStyle: UIStatusBarStyleLightContent
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: "MediaGrid finds and talks to the MediaGrid app on your PC over Wi-Fi or Tailscale."
        NSBonjourServices:
          - _mediagrid._tcp
        NSCameraUsageDescription: "MediaGrid can use this iPhone as your PC's webcam when you start it."
        NSMicrophoneUsageDescription: "MediaGrid can use this iPhone as your PC's microphone when you start it."
        NSPhotoLibraryUsageDescription: "MediaGrid backs up your new photos and videos to your PC."
        NSPhotoLibraryAddUsageDescription: "MediaGrid saves photos and videos from your PC into Photos."
        UIBackgroundModes:
          - audio
          - fetch
          - processing
        BGTaskSchedulerPermittedIdentifiers:
          - com.jeyaprakash.mediagrid.photosync
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: All Files
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.item
              - public.content
              - public.data
              - public.image
              - public.audiovisual-content
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: com.jeyaprakash.mediagrid
            CFBundleURLSchemes:
              - mediagrid

  MediaGridWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jeyaprakash.mediagrid.widgets
        SKIP_INSTALL: YES
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: MediaGrid
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        NSSupportsLiveActivities: true

  MediaGridShare:
    type: app-extension
    platform: iOS
    sources:
      - path: Share
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jeyaprakash.mediagrid.share
        SKIP_INSTALL: YES
    info:
      path: Share/Info.plist
      properties:
        CFBundleDisplayName: MediaGrid
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule: TRUEPREDICATE

schemes:
  MediaGrid:
    build:
      targets:
        MediaGrid: all
        MediaGridWidgets: all
        MediaGridShare: all
