name: MediaGrid
options:
  bundleIdPrefix: com.jeyaprakash
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  MediaGrid:
    type: application
    platform: iOS
    sources:
      - path: MediaGrid
      - path: Shared
    dependencies:
      - target: MediaGridWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jeyaprakash.mediagrid
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: MediaGrid/Info.plist
      properties:
        CFBundleDisplayName: MediaGrid
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: AccentColor
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIStatusBarStyle: UIStatusBarStyleLightContent
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: "MediaGrid finds and talks to the MediaGrid app on your PC over Wi-Fi or Tailscale."
        NSBonjourServices:
          - _mediagrid._tcp
        NSPhotoLibraryUsageDescription: "MediaGrid backs up your new photos and videos to your PC."
        NSPhotoLibraryAddUsageDescription: "MediaGrid saves photos and videos from your PC into Photos."
        UIBackgroundModes:
          - audio
          - fetch
          - processing
        BGTaskSchedulerPermittedIdentifiers:
          - com.jeyaprakash.mediagrid.photosync
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true

  MediaGridWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jeyaprakash.mediagrid.widgets
        SKIP_INSTALL: YES
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: MediaGrid
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        NSSupportsLiveActivities: true

schemes:
  MediaGrid:
    build:
      targets:
        MediaGrid: all
        MediaGridWidgets: all
