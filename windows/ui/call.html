<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>MediaGrid call</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; user-select: none; }
  .pill { height: 64px; margin: 8px; border-radius: 40px; background: rgba(32, 33, 36, 0.95); color: #fff; display: flex; align-items: center; gap: 12px; padding: 0 22px 0 8px; box-shadow: 0 8px 28px rgba(0,0,0,.5); border: 1px solid rgba(255,255,255,.14); cursor: grab; }
  .ico { width: 48px; height: 48px; border-radius: 50%; background: #fff; display: grid; place-items: center; position: relative; flex: none; transition: background .3s; }
  .ico svg { width: 22px; height: 22px; fill: none; stroke: #111; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .ico.ring::after { content: ""; position: absolute; inset: -6px; border-radius: 50%; border: 2px solid #fff; animation: pulse 1.2s ease-out infinite; }
  .ico.end { background: #888; }
  @keyframes pulse { from { transform: scale(.88); opacity: .9; } to { transform: scale(1.35); opacity: 0; } }
  .meta b { display: block; font-size: 14px; font-weight: 650; }
  .meta span { font-size: 13px; color: rgba(255,255,255,.7); font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
  <div class="pill" data-tauri-drag-region>
    <div class="ico ring" id="ico" data-tauri-drag-region>
      <svg viewBox="0 0 24 24"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg>
    </div>
    <div class="meta" data-tauri-drag-region><b id="title">iPhone</b><span id="sub">Call</span></div>
  </div>
<script>
  const T = window.__TAURI__;
  let started = null, timer = null;
  const fmt = (s) => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
  const $ = (id) => document.getElementById(id);
  function tick() { if (started) $("sub").textContent = "On call · " + fmt(Math.max(0, Math.floor((Date.now() - started) / 1000))); }
  function apply(d) {
    clearInterval(timer);
    $("ico").className = "ico";
    if (d.state === "ringing") { $("title").textContent = "Incoming call"; $("sub").textContent = "iPhone is ringing…"; $("ico").classList.add("ring"); }
    else if (d.state === "dialing") { $("title").textContent = "Calling…"; $("sub").textContent = "from your iPhone"; $("ico").classList.add("ring"); }
    else if (d.state === "active") { started = d.started || Date.now(); $("title").textContent = d.direction === "outgoing" ? "Outgoing call" : "Incoming call"; tick(); timer = setInterval(tick, 1000); }
    else if (d.state === "ended") { $("ico").classList.add("end"); $("title").textContent = d.answered ? "Call ended" : "Call missed"; $("sub").textContent = d.answered ? fmt(d.duration || 0) : "iPhone"; }
  }
  T.event.listen("mg", ({ payload }) => { if (payload.event === "call") apply(payload.data); });
</script>
</body>
</html>
