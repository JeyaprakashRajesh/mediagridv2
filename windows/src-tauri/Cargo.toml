[package]
name = "mediagrid"
version = "1.0.0"
description = "MediaGrid — PC companion for the MediaGrid iPhone app"
edition = "2021"

[lib]
name = "mediagrid_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws", "multipart"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs", "cors"] }
futures-util = "0.3"
tokio-util = { version = "0.7", features = ["io"] }
lofty = "0.25"
symphonia = { version = "0.5", features = ["mp3", "aac", "isomp4", "flac", "ogg", "vorbis", "wav", "pcm", "alac"] }
ureq = { version = "2", features = ["json"] }
walkdir = "2"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
enigo = "0.6"
arboard = "3"
xcap = "0.9"
mdns-sd = "0.13"
local-ip-address = "0.6"
dirs = "6"
parking_lot = "0.12"
once_cell = "1"
chrono = { version = "0.4", features = ["serde"] }
hostname = "0.4"
mime_guess = "2"
notify = "8"
tauri-plugin-notification = "2"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "s"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_Graphics_Gdi", "Win32_System_Com"] }
