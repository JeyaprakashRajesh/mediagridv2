# Builds both MediaGrid apps on GitHub-hosted machines (no Mac needed):
#  - iOS: unsigned .ipa (sign + install from Windows with Sideloadly)
#  - Windows: Tauri NSIS installer (.exe) + MSI
# Results are pushed to the "builds" branch so they can be fetched with plain git.
name: Build MediaGrid

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate
      - name: Build (no code signing)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project MediaGrid.xcodeproj \
            -scheme MediaGrid \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log | grep -E "error:|warning: .*deprecated|BUILD (SUCCEEDED|FAILED)" || true
          test -d build/Build/Products/Release-iphoneos/MediaGrid.app
      - name: Show errors
        if: failure()
        working-directory: ios
        run: grep -E " error: " build.log | sort -u | head -80 || true
      - name: Package IPA
        working-directory: ios
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/MediaGrid.app Payload/
          zip -qry ../MediaGrid.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: MediaGrid.ipa

  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows/src-tauri
      - name: Build installer
        working-directory: windows
        run: |
          npm install
          npx tauri build
      - name: Collect
        shell: bash
        run: |
          mkdir -p out
          cp windows/src-tauri/target/release/bundle/nsis/*.exe out/MediaGrid-Setup.exe
          cp windows/src-tauri/target/release/bundle/msi/*.msi out/MediaGrid.msi
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/*

  publish:
    needs: [ios, windows]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dl
      - name: Push to builds branch
        run: |
          mkdir -p /tmp/builds && find dl -type f -exec cp {} /tmp/builds/ \;
          cd /tmp/builds
          ls -la
          [ "$(ls -A)" ] || exit 0
          echo "ios=${{ needs.ios.result }} windows=${{ needs.windows.result }} commit=${GITHUB_SHA::7}" > STATUS.txt
          git init -q -b builds
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Build ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" builds
