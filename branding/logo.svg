<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14112B"/>
      <stop offset="1" stop-color="#05040D"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#7B5CFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7B5CFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="t1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF5FA2"/><stop offset="1" stop-color="#FF8A5B"/></linearGradient>
    <linearGradient id="t2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8F6BFF"/><stop offset="1" stop-color="#5B3BEA"/></linearGradient>
    <linearGradient id="t3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2FD4FF"/><stop offset="1" stop-color="#3D7BFF"/></linearGradient>
    <linearGradient id="t4" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3CF2B5"/><stop offset="1" stop-color="#17B8C9"/></linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <mask id="cut">
      <rect width="1024" height="1024" fill="#fff"/>
      <!-- play triangle punched through the grid -->
      <path d="M418 352 Q418 318 448 335 L668 476 Q700 512 668 548 L448 689 Q418 706 418 672 Z" fill="#000"/>
    </mask>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="26"/></filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>
  <!-- color bloom behind tiles -->
  <g filter="url(#soft)" opacity="0.55">
    <rect x="236" y="236" width="252" height="252" rx="76" fill="url(#t1)"/>
    <rect x="536" y="236" width="252" height="252" rx="126" fill="url(#t2)"/>
    <rect x="236" y="536" width="252" height="252" rx="76" fill="url(#t3)"/>
    <rect x="536" y="536" width="252" height="252" rx="76" fill="url(#t4)"/>
  </g>
  <g mask="url(#cut)">
    <rect x="236" y="236" width="252" height="252" rx="76" fill="url(#t1)"/>
    <rect x="536" y="236" width="252" height="252" rx="126" fill="url(#t2)"/>
    <rect x="236" y="536" width="252" height="252" rx="76" fill="url(#t3)"/>
    <rect x="536" y="536" width="252" height="252" rx="76" fill="url(#t4)"/>
    <!-- glass sheen -->
    <rect x="236" y="236" width="252" height="252" rx="76" fill="url(#sheen)"/>
    <rect x="536" y="236" width="252" height="252" rx="126" fill="url(#sheen)"/>
    <rect x="236" y="536" width="252" height="252" rx="76" fill="url(#sheen)"/>
    <rect x="536" y="536" width="252" height="252" rx="76" fill="url(#sheen)"/>
  </g>
  <!-- sync arc around the round tile -->
  <path d="M662 268 A94 94 0 0 1 756 362" fill="none" stroke="#FFFFFF" stroke-opacity="0.9" stroke-width="18" stroke-linecap="round"/>
  <path d="M662 456 A94 94 0 0 1 568 362" fill="none" stroke="#FFFFFF" stroke-opacity="0.9" stroke-width="18" stroke-linecap="round"/>
  <circle cx="662" cy="362" r="20" fill="#FFFFFF"/>
  <path d="M446 404 Q446 382 466 394 L622 494 Q644 512 622 530 L466 630 Q446 642 446 620 Z" fill="#FFFFFF"/>
  <path d="M446 404 Q446 382 466 394 L622 494 Q644 512 622 530 L466 630 Q446 642 446 620 Z" fill="url(#t2)" opacity="0.18"/>
</svg>
